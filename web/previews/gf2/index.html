<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>克莱妲 · 原游戏材质预览</title><link rel="icon" href="data:,"><link rel="stylesheet" href="preview.css"><script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js"}}</script></head>
<body><header><div><span class="eyebrow">少女前线 2 · MMD</span><h1>克莱妲<span>原游戏材质</span></h1></div><a class="tag" href="frame.html">原始抓帧对照</a></header>
<main><section class="stage"><div id="viewer"><span class="hint">拖动旋转 · 滚轮缩放 · 右键平移</span></div><div class="views"><button id="barrack-view">兵营原机位</button><button id="reference-pose" aria-pressed="false" disabled>原帧姿态</button><button data-view="front">正面</button><button data-view="left">左侧</button><button data-view="right">右侧</button><button data-view="back">背面</button><button data-view="face">脸部近景</button><a class="compare-link" href="pmx-comparison.html">PMX同姿态对照</a></div><p id="pose-note" class="description">现有VMD动作 · 可旋转、播放和跳帧</p><div id="status" role="status">正在加载模型…</div><button id="retry" hidden>重新加载</button></section>
<aside><section><h2>材质对比</h2><div class="toggle"><button id="game" aria-pressed="true" disabled>原游戏材质</button><button id="classic" aria-pressed="false" disabled>PMX基础材质</button></div><p class="description">读取原始贴图与渐变响应，保持同一模型、动作和镜头。</p><dl><dt>材质接入</dt><dd id="binding">—</dd><dt>第二套纹理坐标</dt><dd id="uv">读取中</dd></dl></section>
<section><h2>观察光照</h2><label for="light">主光方位 <output id="light-value">−30°</output></label><input id="light" type="range" min="-180" max="180" value="-30"><label for="exposure">曝光 <output id="exposure-value">0.0</output></label><input id="exposure" type="range" min="-1.5" max="1.5" value="0" step="0.1"><div class="checks"><label><input id="normal" type="checkbox" checked> 法线细节</label><label><input id="ramp" type="checkbox" checked> 原始明暗渐变</label><label><input id="specular" type="checkbox" checked> 实时高光</label></div></section>
<section><h2>动作试播</h2><label for="motion-select">动作来源</label><select id="motion-select" aria-label="动作来源" disabled><option value="">读取主舞台待机动作…</option></select><div class="playback"><button id="play" disabled>播放</button><button id="restart" disabled>回到开头</button><select id="speed" aria-label="播放速度"><option value="0.5">0.5倍</option><option value="1" selected>1倍</option><option value="1.5">1.5倍</option></select></div><input id="timeline" aria-label="动作时间" type="range" min="0" max="260" value="0" step="0.1" disabled><div class="time"><span id="time">0.00 / 8.67 秒</span><label><input id="loop" type="checkbox" checked> 循环</label></div><p class="description">默认播放主舞台待机循环动作，可切换到进场或其它循环段；先暂停观察，再拖动时间条检查材质随姿态的变化。</p></section>
<p class="boundary">本预览已接入原始材质数据与部分光照公式。游戏场景光照、专用投影和最终画面一致性仍待对照。</p></aside></main><script type="module" src="preview.js"></script></body></html>
