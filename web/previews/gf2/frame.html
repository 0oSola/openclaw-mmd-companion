<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>克莱妲 · 原始抓帧重绘</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101619;color:#e6e9e8;font:14px/1.65 system-ui,sans-serif}header{padding:20px 28px;max-width:1500px;margin:auto}h1{font-size:24px;margin:0 0 6px}p{margin:6px 0;color:#a8b5b9}a{color:#b7d5d8}button,select{padding:7px 12px;border:1px solid #4e626a;background:#202c31;color:inherit;border-radius:4px}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;max-width:1800px;margin:auto}figure{margin:0;min-width:0}figcaption{padding:10px 20px;background:#233038}canvas,img{width:100%;height:auto;display:block}.source-linear{transform:scaleY(-1)}#status{color:#e0c58e;white-space:pre-wrap}.pair.overlay{display:block;position:relative;max-width:900px}.overlay figure:last-child{position:absolute;inset:0;opacity:var(--mix,.5)}.overlay figure:last-child figcaption{visibility:hidden}.focus{max-width:1060px}.focus .viewport{aspect-ratio:580/1200;position:relative;overflow:hidden}.focus .viewport :is(canvas,img){position:absolute;width:440%;max-width:none;left:-168.9655%;top:-5.8333%}.focus.overlay{max-width:530px}@media(max-width:750px){.pair{grid-template-columns:1fr}}body.capture header,body.capture figcaption,body.capture figure:first-child{display:none}body.capture .pair{display:block;max-width:none}body.capture canvas{width:100vw;height:100vh;object-fit:contain}
</style>
<style>body:not(.capture) #frame{display:none}body.capture #render-image{display:none}</style>
<header><h1>克莱妲 · 原始抓帧重绘</h1><p>使用同一帧的原始姿态、40° 相机、纹理、灯光、环境反射与着色程序，检查网页移植的实际差异。</p>
<nav><a href="/">动态 MMD 预览</a><a href="/game-assets/frame/reference-final.png" target="_blank">完整实机原帧</a><button id="side">并排</button><button id="overlay">叠图</button><button id="crop">完整场景</button><label>混合 <input id="mix" type="range" min="0" max="100" value="50"><output id="mix-value">50%</output></label><label>阶段 <select id="display"><option value="pipeline">最终画面</option><option value="linear">角色线性颜色</option><option value="post">仅颜色映射</option></select></label><button id="retry">重新加载</button></nav>
<p id="status">正在读取抓帧资源…</p><p>第 7480 帧：角色和后续绘制在浏览器重新计算；场景前置画面、环境遮蔽、深度和上一帧历史来自原抓帧。此页验证固定帧移植；动态 PMX／VMD 使用左侧的 MMD 预览入口。</p></header>
<main class="pair" id="pair"><figure><figcaption id="source-caption">原游戏 · 界面叠加前</figcaption><div class="viewport"><img src="/game-assets/frame/reference-post-display.png"></div></figure><figure><figcaption>浏览器 · 原机位、原姿态重新绘制</figcaption><div class="viewport"><canvas id="frame"></canvas><img id="render-image" alt="浏览器本次重新绘制的画面"></div></figure></main>
<script type="module" src="./frame.js"></script></html>
