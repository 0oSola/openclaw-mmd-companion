<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>克莱妲 · PMX同姿态对照</title><link rel="icon" href="data:,"><style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#10171b;color:#e0e9ee}body{margin:0}header{padding:24px 28px;border-bottom:1px solid #34434b}h1{font-size:23px;margin:0 0 12px}p{font-size:14px;line-height:1.8;color:#b4c5d0;margin:8px 0}a{color:#a7d4ed}nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}button{font:inherit;padding:10px 16px;color:#e0e9ee;background:#24333c;border:1px solid #536873;cursor:pointer}button[aria-pressed=true]{background:#b7ccd7;color:#13202a}.pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#34434b}figure{margin:0;background:#000;text-align:center}figcaption{text-align:left;background:#20303a;padding:15px 22px;font-size:15px}img{display:block;margin:auto;width:100%;height:auto;max-height:calc(100vh - 290px);object-fit:contain}#metrics{font-variant-numeric:tabular-nums}@media(max-width:650px){header{padding:18px}.pair{grid-template-columns:1fr}img{max-height:75vh}h1{font-size:20px}}
</style></head><body><header><h1>克莱妲 · PMX同姿态对照</h1><p>左侧为原游戏角色绘制，右侧为首页实际加载的PMX。两侧使用同一机位、原帧姿态、黑色背景与颜色映射。</p><p>首页的「原帧姿态」可旋转观察；播放会返回现有VMD。本页比较角色本身，不包含兵营背景和整幅画面的后期处理。</p><p id="metrics">正在读取测量结果…</p><nav><a href="/">返回动态MMD预览</a><button id="detail" aria-pressed="true">脸部与衣料</button><button id="full" aria-pressed="false">完整角色</button></nav></header><main class="pair"><figure><figcaption>原游戏 · 第7480帧角色</figcaption><img id="source" alt="原游戏角色同姿态画面" src="/game-assets/pmx-reference-check/source-detail.png"></figure><figure><figcaption>首页PMX · 同机位、同姿态</figcaption><img id="pmx" alt="首页实际PMX同姿态渲染" src="/game-assets/pmx-reference-check/pmx-detail.png"></figure></main><script type="module">
const base='/game-assets/pmx-reference-check/';
for(const id of ['detail','full'])document.getElementById(id).onclick=()=>{for(const target of ['detail','full'])document.getElementById(target).setAttribute('aria-pressed',String(id===target));for(const side of ['source','pmx'])document.getElementById(side).src=base+side+'-'+id+'.png';};
try{const r=await fetch(base+'result.json');if(!r.ok)throw new Error('测量结果返回 '+r.status);const data=await r.json(),m=data.measurement;document.getElementById('metrics').textContent=`原生 ${m.width} × ${m.height} · 角色前景平均通道误差 ${m.meanAbsoluteByteError.toFixed(3)} / 255 · 两侧前景并集 ${m.foregroundPixels.toLocaleString()} 像素`;}
catch(error){document.getElementById('metrics').textContent='读取失败：'+error.message;}
</script></body></html>
