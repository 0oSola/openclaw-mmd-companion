$schema: https://json-schema.org/draft/2020-12/schema
$id: codex-knowledge-handoff-payload-v1
title: Codex Knowledge Handoff Payload
type: object
additionalProperties: false
required:
  - kind
  - schema_version
  - marker
  - artifacts
properties:
  kind:
    const: codex_knowledge_handoff_payload
  schema_version:
    const: 1
  marker:
    $ref: "#/$defs/marker"
  artifacts:
    type: array
    minItems: 1
    maxItems: 16
    items:
      $ref: "#/$defs/artifact"
$defs:
  marker:
    type: object
    additionalProperties: false
    required:
      - kind
      - schema_version
      - knowledge_candidates
    properties:
      kind:
        const: codex_knowledge_marker
      schema_version:
        const: 1
      knowledge_candidates:
        type: array
        minItems: 1
        maxItems: 16
        items:
          $ref: "#/$defs/candidate"
  candidate:
    type: object
    additionalProperties: false
    required:
      - local_id
      - title
      - knowledge_kind_hint
      - change_kind
      - author_summary
      - why_reusable
      - artifact
      - related_topic_hints
      - term_changes
      - evidence_hints
      - pending_verification
    properties:
      local_id:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,127}$"
      title:
        type: string
        minLength: 1
        maxLength: 300
      knowledge_kind_hint:
        enum:
          - concept
          - entity
          - relationship
          - rule
          - workflow
          - contract
          - gate
          - policy
          - architecture_decision
          - failure_classification
      change_kind:
        enum:
          - introduce
          - modify
          - deprecate
      author_summary:
        type: string
        minLength: 1
      why_reusable:
        type: string
        minLength: 1
      artifact:
        type: object
        additionalProperties: false
        required:
          - path
          - media_type
        properties:
          path:
            type: string
            pattern: "^candidates/[A-Za-z0-9][A-Za-z0-9._-]*\\.md$"
          media_type:
            const: text/markdown
      related_topic_hints:
        type: array
        items:
          type: string
      term_changes:
        type: array
      evidence_hints:
        type: array
        items:
          type: object
      pending_verification:
        type: array
        items:
          type: string
  artifact:
    type: object
    additionalProperties: false
    required:
      - path
      - media_type
      - content
    properties:
      path:
        type: string
        pattern: "^candidates/[A-Za-z0-9][A-Za-z0-9._-]*\\.md$"
      media_type:
        const: text/markdown
      content:
        type: string
        minLength: 1
